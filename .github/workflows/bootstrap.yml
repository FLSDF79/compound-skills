name: verified one-shot bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Import validated snapshot
        shell: bash
        env:
          SOURCE_URL: https://2c0307c4b30056.lhr.life/compound-skills-v2.2.0.zip
          SOURCE_SHA256: 2a5336fe8e8cce35e6740266406ceab16555c024a5e07bbdbb64705ed9e670bf
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/source.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/source" <<'PY'
          import pathlib, sys, zipfile
          archive, target = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(target)
          PY
          test -f "$RUNNER_TEMP/source/compound-skills/skill/compound-skills/scripts/compound.py"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/source/compound-skills/." .
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile skill/compound-skills/scripts/compound.py tests/test_compound.py
          python3 skill/compound-skills/scripts/compound.py sanitize .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m '[verified] publish compound-skills v2.2.0'
          git push origin HEAD:main
